[project]
name = "ecommerce-agent"
version = "0.1.0"
description = "AI-powered e-commerce operations agent for inventory, pricing, and product selection"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "json_repair>=0.25.0",
    "pipmaster>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27.0",
]
kg = [
    "lightrag-hku>=1.0.0",
    "json_repair>=0.25.0",
    "pipmaster>=1.0.0",
]

[project.scripts]
ecommerce-agent = "ecommerce_agent.main:main"

[tool.pytest.ini_options]
testpaths = ["ecommerce_agent/tests"]
